; Okovision - surcharges PHP (chargé après php.ini-production)

; Import des CSV / dumps (mêmes valeurs que le .htaccess)
upload_max_filesize = 50M
post_max_size = 52M

; Imports de masse et mises à jour
memory_limit = 256M
max_execution_time = 120

; Erreurs : journalisées, jamais affichées
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off