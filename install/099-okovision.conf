<VirtualHost *:80>
    #ServerName www.example.com
	AddDefaultCharset UTF-8
    ServerAdmin stawen@dronek.com
    DocumentRoot /var/www/okovision

    <Directory /var/www/okovision>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <DirectoryMatch "^/var/www/okovision/(_logs|_tmp|dumps|var|install|_include|_templates)(/|$)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(?i)\.(log|sql|json|bak|md|txt|ini|sh|csv)$|^config\.php\.bak|^\.(git|ht)">
        Require all denied
    </FilesMatch>

	ErrorLog ${APACHE_LOG_DIR}/okovision-error.log
    CustomLog ${APACHE_LOG_DIR}/okovision-access.log combined

</VirtualHost>